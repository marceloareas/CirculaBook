spring.application.name=circula-book

# ===== PostgreSQL =====
# Padrões só para desenvolvimento; fora dele defina DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/circula_book_db}
spring.datasource.username=${DB_USER:circula_user}
spring.datasource.password=${DB_PASSWORD:circula_senha_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# "create" recria o schema a cada start (bom para desenvolvimento).
# Troque para "update" quando quiser preservar os dados entre execucoes.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Evita o erro de serializacao JSON em relacionamentos LAZY do Hibernate
spring.jackson.serialization.fail-on-empty-beans=false

# ===== SQL Init (executa data.sql apos o Hibernate criar as tabelas) =====
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# ===== JWT =====
# Em producao defina a variavel de ambiente JWT_SECRET (>= 32 caracteres).
# O valor padrao abaixo serve APENAS para desenvolvimento local.
circulabook.jwt.secret=${JWT_SECRET:dev-only-circula-book-segredo-local-nao-usar-em-producao}
circulabook.jwt.expiracao-horas=8

# ===== Server =====
server.port=8080
server.servlet.context-path=/

# ===== Logging =====
logging.level.root=INFO
logging.level.com.circulabook=DEBUG
